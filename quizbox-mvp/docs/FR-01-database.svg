    <g transform="translate(40 582)">
      <rect width="1166" height="117" rx="9" fill="#ffffff" stroke="#a1b6c7"/>
      <text x="16" y="26" font-size="15" font-weight="700">Составные внешние ключи в answers</text>
      <text x="726" y="26" font-size="14" fill="#425e73">PK — первичный ключ · FK — внешний ключ</text>
      <g font-size="13" font-family="Consolas, monospace">
