      <text x="49" y="117" font-size="14" font-family="Consolas, monospace">session_id</text>
      <text x="14" y="139" font-size="12" font-weight="700" fill="#215f8b">FK</text>
      <text x="49" y="139" font-size="14" font-family="Consolas, monospace">participant_id</text>
      <text x="14" y="161" font-size="12" font-weight="700" fill="#215f8b">FK</text>
      <text x="49" y="161" font-size="14" font-family="Consolas, monospace">question_id</text>
      <text x="14" y="183" font-size="12" font-weight="700" fill="#215f8b">FK</text>
      <text x="49" y="183" font-size="14" font-family="Consolas, monospace">option_id</text>
      <text x="49" y="205" font-size="14" font-family="Consolas, monospace">awarded_points</text>
