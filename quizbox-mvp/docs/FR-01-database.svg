      <path d="M9 0 H231 Q240 0 240 9 V54 H0 V9 Q0 0 9 0 Z" fill="#153c59"/>
      <text x="14" y="22" font-size="16" font-weight="700" fill="#ffffff">quizzes</text>
      <text x="14" y="42" font-size="13" fill="#d4e7f4">Викторины</text>
      <text x="14" y="73" font-size="12" font-weight="700" fill="#215f8b">PK</text>
      <text x="49" y="73" font-size="14" font-family="Consolas, monospace">id</text>
      <text x="49" y="95" font-size="14" font-family="Consolas, monospace">title</text>
      <text x="49" y="117" font-size="14" font-family="Consolas, monospace">created_at</text>
