<svg xmlns="http://www.w3.org/2000/svg" width="1246" height="725" viewBox="0 0 1246 725" role="img" aria-labelledby="title description">
  <title id="title">QuizBox · Схема базы данных SQLite</title>
  <desc id="description">Шесть таблиц. Викторины содержат вопросы и запускаются в игровых сессиях. Варианты привязаны к вопросам, участники к сессиям. Ответы связаны составными внешними ключами с сессией, участником, вопросом и вариантом.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#37658b"/>
    </marker>
  </defs>
  <rect width="1246" height="725" fill="#f2f6fa"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#132c42">
    <text x="40" y="46" font-size="27" font-weight="700">QuizBox · Схема базы данных SQLite</text>
    <text x="40" y="72" font-size="15" fill="#425e73">FR-01 · Версия схемы 1 · Каждая стрелка показывает связь 1 к 0…N</text>
